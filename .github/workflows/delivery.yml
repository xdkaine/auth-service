name: Application delivery
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.config.outputs.images }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: config
        run: |
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'deploy/scripts')
          from publish_release import validate_config
          config = json.load(open('deploy/delivery.json'))
          validate_config(config)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('images=' + json.dumps({'include': config['images']}, separators=(',', ':')) + '\n')
          PY
      - run: python3 -m unittest discover -s deploy/scripts -p '*_test.py'
  images:
    needs: [checks, matrix]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.images) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ matrix.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            APP_REVISION=${{ github.sha }}
            ${{ matrix.buildArgs }}
          cache-from: type=gha,scope=${{ github.ref_name }}-${{ matrix.kind }}
          cache-to: type=gha,scope=${{ github.ref_name }}-${{ matrix.kind }},mode=max
      - name: Record immutable image
        env:
          IMAGE_KIND: ${{ matrix.kind }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          pathlib.Path('digests').mkdir(exist_ok=True)
          kind = os.environ['IMAGE_KIND']
          pathlib.Path('digests', kind + '.json').write_text(json.dumps({'kind': kind, 'digest': os.environ['IMAGE_DIGEST'], 'source': os.environ['GITHUB_SHA']}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: digest-${{ matrix.kind }}
          path: digests/*.json
          retention-days: 7
  release:
    needs: [checks, matrix, images]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Publish complete deployment receipt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 deploy/scripts/publish_release.py
